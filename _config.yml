title: "InnovationLet Space"
short_title: "Space"
tagline: "Launches, exploration, and the business of orbit."
description: >-
  InnovationLet Space covers launch, exploration, satellites and the
  economics of the space industry. Independent reporting and analysis
  from the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/space"
main_site: "https://innovationlet.github.io"

category_name: "Space"
category_meta: "Launches · Exploration · Satellites"
accent: "red"
hero_title: "The new space race, from the ground up."
hero_lead: >-
  Launch, exploration and satellites, with the engineering and the
  economics that actually decide what reaches orbit.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
